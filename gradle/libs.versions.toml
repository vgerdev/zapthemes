[versions]
gson = "2.15.0"
javaparser = "3.28.2"
junit = "6.1.3"
# JFace 3.40.0 (R4_41) dependencies, as in its published POM
equinox-common = "3.21.0"
equinox-bidi = "1.5.400"
core-commands = "3.13.0"
eclipse-osgi = "3.24.300"
pde-annotations = "1.4.100"
# SVG rasterizer fragment built against SWT 3.135.0 (JFace 3.40 ships SVG icons)
swt-svg = "3.133.100"
# JFace data binding 1.16.0 (R4_41); it brings core.databinding* through its POM (Phase 7)
jface-databinding = "1.16.0"
# Nebula Timeline
emf-ecore = "2.43.0"
core-jobs = "3.15.900"
# JFace notifications 0.8.100 (R4_41) requires core.runtime (Phase 7)
core-runtime = "3.35.0"
# JFace Text 3.31.100 (R4_41) and org.eclipse.text 3.14.800, built from source (Phase 7)
equinox-preferences = "3.12.100"
assertj = "3.27.7"

[libraries]
equinox-common = { module = "org.eclipse.platform:org.eclipse.equinox.common", version.ref = "equinox-common" }
equinox-bidi = { module = "org.eclipse.platform:org.eclipse.equinox.bidi", version.ref = "equinox-bidi" }
core-commands = { module = "org.eclipse.platform:org.eclipse.core.commands", version.ref = "core-commands" }
jface-databinding = { module = "org.eclipse.platform:org.eclipse.jface.databinding", version.ref = "jface-databinding" }
eclipse-osgi = { module = "org.eclipse.platform:org.eclipse.osgi", version.ref = "eclipse-osgi" }
swt-svg = { module = "org.eclipse.platform:org.eclipse.swt.svg", version.ref = "swt-svg" }
emf-ecore = { module = "org.eclipse.emf:org.eclipse.emf.ecore", version.ref = "emf-ecore" }
core-runtime = { module = "org.eclipse.platform:org.eclipse.core.runtime", version.ref = "core-runtime" }
equinox-preferences = { module = "org.eclipse.platform:org.eclipse.equinox.preferences", version.ref = "equinox-preferences" }
core-jobs = { module = "org.eclipse.platform:org.eclipse.core.jobs", version.ref = "core-jobs" }
pde-annotations = { module = "org.eclipse.pde:org.eclipse.pde.api.tools.annotations", version.ref = "pde-annotations" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
javaparser-core = { module = "com.github.javaparser:javaparser-core", version.ref = "javaparser" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
