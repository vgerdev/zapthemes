name: release

# Builds, signs and uploads a Maven Central bundle for a version tag (v1.0.0 -> 1.0.0).
# The upload is a user-managed deployment: nothing is released until it is published by hand
# at https://central.sonatype.com/publishing/deployments. See docs/releasing.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version, e.g. 1.0.0
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch upstream sources
        run: scripts/fetch-upstream.sh
      - name: Install GTK
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 xvfb
      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test, sign and upload
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: >-
          xvfb-run -a ./gradlew build :zapthemes-demo:smokeTest :zapthemes-samples:smokeTest
          centralBundle uploadToCentral -Pversion=${{ steps.version.outputs.version }} --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: central-bundle
          path: build/central/*.zip
