name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    # A hung GUI test should fail fast with a stack trace, not wait to be cancelled.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch upstream sources
        shell: bash
        run: scripts/fetch-upstream.sh
      - name: Install GTK (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 xvfb
      - name: Build and test (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew build :zapthemes-demo:smokeTest :zapthemes-editor:smokeTest :zapthemes-samples:smokeTest :zapthemes-examples:smokeTest --console=plain
      - name: Build and test
        if: runner.os != 'Linux'
        shell: bash
        run: ./gradlew build :zapthemes-demo:smokeTest :zapthemes-editor:smokeTest :zapthemes-samples:smokeTest :zapthemes-examples:smokeTest --console=plain
      # Screenshots of every demo in every theme, to review GTK and Cocoa rendering by eye.
      - name: Screenshots (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1200x24" ./gradlew :zapthemes-demo:screenshots :zapthemes-editor:screenshots --console=plain
      # ZapNotes builds on the staged artifacts only, as an outside application would.
      - name: ZapNotes on the staged artifacts (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: ./gradlew publishToStaging --console=plain && xvfb-run -a ./gradlew -p apps/zapnotes smokeTest --console=plain
      - name: ZapNotes on the staged artifacts
        if: runner.os != 'Linux'
        shell: bash
        run: ./gradlew publishToStaging --console=plain && ./gradlew -p apps/zapnotes smokeTest --console=plain
      # Every JFace snippet in its own JVM: tagged, closes, a PNG each (Control.print is reliable here).
      - name: JFace snippets (Linux, under Xvfb)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a -s "-screen 0 1600x1200x24" ./gradlew :zapthemes-examples:screenshotsSnippets --console=plain
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: snippets-${{ matrix.os }}
          path: zapthemes-examples/build/screenshots/snippets/
      - name: Screenshots
        if: runner.os == 'macOS'
        run: ./gradlew :zapthemes-demo:screenshots :zapthemes-editor:screenshots --console=plain
      # Control.print on Cocoa leaves dialogs blank and cannot capture hovers; screen captures show
      # what users see (zapthemes-demo/build/screenshots/screen).
      - name: Screen captures of the JFace demo (macOS)
        if: runner.os == 'macOS'
        run: ./gradlew :zapthemes-demo:screenCapturesJFace --console=plain
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Windows'
        with:
          name: screenshots-${{ matrix.os }}
          path: |
            zapthemes-demo/build/screenshots/
            zapthemes-editor/build/screenshots/
          if-no-files-found: error

  # FreeBSD: no SWT fragment is published upstream; the build uses the ports SWT jar
  # (x11-toolkits/swt) via -Pswt.localJar. Enable once the ports SWT version matches 3.135.0.
